name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release tag must match the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest_version=$(python3 -c "import json; print(json.load(open('custom_components/upsnap/manifest.json'))['version'])")
          echo "manifest: $manifest_version, tag: $TAG"
          test "$manifest_version" = "${TAG#v}"
