name: Feature request
description: Suggest an idea for the UpSnap integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case rather than the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could the integration help?
